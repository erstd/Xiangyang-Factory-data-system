name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
        pip uninstall -y jwt
        pip install PyJWT
        pip install pyinstaller

    - name: Build Python backend
      run: |
        pyinstaller --onefile --name xiangyang-backend api_server.py

    - name: Install Electron dependencies
      working-directory: ./electron-app
      run: npm install

    - name: Build Electron app
      working-directory: ./electron-app
      run: npm run build:win

    - name: Verify Electron build
      working-directory: ./electron-app
      run: |
        Write-Host "Checking build output..."
        Get-ChildItem -Recurse dist-electron\win-unpacked | Select-Object -First 30

    - name: Create release package
      run: |
        mkdir release
        mkdir release\xiangyang-factory

        # Copy backend
        copy dist\xiangyang-backend.exe release\xiangyang-factory\
        copy xiangyang_factory.db release\xiangyang-factory\

        # Copy electron app files
        xcopy electron-app\dist-electron\win-unpacked release\xiangyang-factory\ /E /I

        echo @echo off > release\xiangyang-factory\start.bat
        echo echo Starting Xiangyang Factory Management System... >> release\xiangyang-factory\start.bat
        echo start /B xiangyang-backend.exe >> release\xiangyang-factory\start.bat
        echo timeout /t 2 /nobreak ^>nul >> release\xiangyang-factory\start.bat
        echo start "xiangyang-factory" "xiangyang-factory.exe" >> release\xiangyang-factory\start.bat

    - name: Create ZIP archive
      run: |
        cd release
        powershell Compress-Archive -Path xiangyang-factory -DestinationPath xiangyang-factory-windows.zip

    - name: Upload Release Asset
      uses: actions/upload-artifact@v4
      with:
        name: xiangyang-factory-windows
        path: release/xiangyang-factory-windows.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release/xiangyang-factory-windows.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}