name: Build Windows Release

on:
  push:
    tags:
      - 'v*'  # 当推送v开头的tag时触发，如 v1.0.0
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
        pip uninstall -y jwt
        pip install PyJWT
        pip install pyinstaller

    - name: Build Python backend
      run: |
        pyinstaller --onefile --name xiangyang-backend api_server.py

    - name: Install Electron dependencies
      working-directory: ./electron-app
      run: npm install

    - name: Build Electron app
      working-directory: ./electron-app
      run: npm run build:win

    - name: Create release package
      run: |
        mkdir release
        mkdir release\xiangyang-factory
        copy dist\xiangyang-backend.exe release\xiangyang-factory\
        copy xiangyang_factory.db release\xiangyang-factory\
        xcopy electron-app\dist-electron release\xiangyang-factory\ /E /I

        echo @echo off > release\xiangyang-factory\start.bat
        echo echo 启动向阳厂管理系统... >> release\xiangyang-factory\start.bat
        echo start /B xiangyang-backend.exe >> release\xiangyang-factory\start.bat
        echo timeout /t 2 /nobreak ^>nul >> release\xiangyang-factory\start.bat
        echo start "向阳厂管理系统" "向阳厂管理系统.exe" >> release\xiangyang-factory\start.bat

    - name: Create ZIP archive
      run: |
        cd release
        powershell Compress-Archive -Path xiangyang-factory -DestinationPath xiangyang-factory-windows.zip

    - name: Upload Release Asset
      uses: actions/upload-artifact@v3
      with:
        name: xiangyang-factory-windows
        path: release/xiangyang-factory-windows.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release/xiangyang-factory-windows.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
